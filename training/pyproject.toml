[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quoridor-lab"
version = "0.1.4"
description = "Quoridor Lab rules, local training API and reference expert adapter"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "gymnasium>=1.0", "python-socketio[client]>=5.11,<6", "fastapi>=0.110", "uvicorn>=0.30"]

[project.optional-dependencies]
learning = ["torch>=2.2"]
test = ["httpx>=0.27"]

[project.scripts]
quoridor-lab = "quoridor_lab.cli:main"
barricade-lab = "quoridor_lab.cli:main"

[tool.setuptools.packages.find]
include = ["quoridor_lab*", "barricade_lab*"]
