name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install './training[test]'
      - name: Test without contacting the expert service
        working-directory: training
        run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build:sites
        working-directory: frontend
      - run: npm run test:sites
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/package_release.py --output releases/Quoridor-Lab.zip
      # Distribution ZIPs are attached to GitHub Releases. Keep CI focused on
      # tests/build/package validation, without consuming Actions artifact quota.
